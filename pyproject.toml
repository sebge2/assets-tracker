[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "assets-tracker"
version = "0.1.0"
description = "Application desktop locale de suivi de portefeuille (PySide6, SQLite, yfinance)"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "PySide6>=6.7",
    "yfinance>=0.2.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-qt>=4.4",
    "ruff>=0.6",
    "mypy>=1.11",
    "pyinstaller>=6.10",
]

[project.gui-scripts]
assets-tracker = "assets_tracker.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/assets_tracker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["yfinance"]
ignore_missing_imports = true
